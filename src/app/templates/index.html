<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detection</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h1 { color: #333; }
        .upload-section { margin-top: 30px; padding: 20px; border: 2px dashed #ccc; border-radius: 8px; }
        input[type="file"] { margin-bottom: 20px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 30px; font-size: 18px; padding: 20px; border-radius: 8px; display: none; }
        .result-real { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .result-fake { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loader { border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #3498db; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kiểm tra Video Deepfake</h1>
        <p>Tải lên một video để kiểm tra xem nó có phải là deepfake hay không.</p>

        <div class="upload-section">
            <input type="file" id="videoFile" accept="video/*">
            <button onclick="uploadVideo()">Kiểm tra Video</button>
        </div>

        <div class="loader" id="loader"></div>
        <div id="result"></div>
    </div>

    <script>
        function uploadVideo() {
            const fileInput = document.getElementById('videoFile');
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');

            if (fileInput.files.length === 0) {
                alert('Vui lòng chọn một file video.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            resultDiv.style.display = 'none';
            loader.style.display = 'block';

            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

            fetch('/predict_video', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loader.style.display = 'none';
                if (data.error) {
                    resultDiv.className = 'result-fake';
                    resultDiv.innerHTML = `<strong>Lỗi:</strong> ${data.error}`;
                } else {
                    resultDiv.className = data.verdict === 'REAL' ? 'result-real' : 'result-fake';
                    resultDiv.innerHTML = `<strong>Kết luận: ${data.verdict}</strong><br><small>${data.reason}</small>`;
                }
                resultDiv.style.display = 'block';
            })
            .catch(error => {
                loader.style.display = 'none';
                resultDiv.className = 'result-fake';
                resultDiv.innerHTML = `<strong>Lỗi kết nối:</strong> ${error}`;
                resultDiv.style.display = 'block';
            });
        }
    </script>
</body>
</html>
